# Configuration file for Azure Copilot testing

[settings]
project_name = azure-copilot-migrate
version = 1.0.0
python_version = 3.9+

[azure]
# Azure configuration (use environment variables for sensitive data)
default_region = eastus
default_resource_group = copilot-test-rg

[testing]
# Testing configuration
run_integration_tests = false
mock_azure_services = true
verbose_output = true

[copilot]
# GitHub Copilot testing preferences
suggest_comments = true
suggest_tests = true
suggest_documentation = true
